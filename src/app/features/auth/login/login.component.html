<div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center">
  <div class="card shadow-lg" style="max-width: 400px; width: 100%;">
    <div class="card-body p-5">
      <!-- Header -->
      <div class="text-center mb-4">
        <img src="assets/logo.svg" alt="Logo" height="50" class="mb-3">
        <h2 class="fw-bold" style="color: var(--text-color);">Welcome Back</h2>
        <p class="text-muted">Please login to your account</p>
      </div>

      <!-- Form -->
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <!-- Email -->
        <div class="mb-3">
          <label class="form-label">Email Address</label>
          <input 
            type="email" 
            class="form-control" 
            [class.is-invalid]="f['email'].invalid && f['email'].touched"
            formControlName="email"
            placeholder="Enter your email">
          <div class="invalid-feedback" *ngIf="f['email'].invalid && f['email'].touched">
            <span *ngIf="f['email'].errors?.['required']">Email is required</span>
            <span *ngIf="f['email'].errors?.['email']">Enter a valid email</span>
          </div>
        </div>

        <!-- Password -->
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input 
            type="password" 
            class="form-control"
            [class.is-invalid]="f['password'].invalid && f['password'].touched"
            formControlName="password"
            placeholder="Enter your password">
          <div class="invalid-feedback" *ngIf="f['password'].invalid && f['password'].touched">
            <span *ngIf="f['password'].errors?.['required']">Password is required</span>
            <span *ngIf="f['password'].errors?.['minlength']">
              Password must be at least 6 characters
            </span>
          </div>
        </div>

        <!-- Remember & Forgot -->
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input type="checkbox" class="form-check-input" id="remember">
            <label class="form-check-label" for="remember">Remember me</label>
          </div>
          <a routerLink="/auth/forgot-password" class="text-decoration-none">
            Forgot Password?
          </a>
        </div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          class="btn btn-primary w-100 py-2 fw-bold"
          [disabled]="loading">
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
          {{ loading ? 'Logging in...' : 'Login' }}
        </button>
      </form>

      <!-- Register Link -->
      <div class="text-center mt-4 pt-3 border-top">
        <p class="mb-0 text-muted">
          Don't have an account? 
          <a routerLink="/auth/register" class="text-decoration-none fw-bold">
            Register here
          </a>
        </p>
      </div>
    </div>
  </div>
</div>
